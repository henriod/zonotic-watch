# Serves the built SPA. The /api path never reaches here — Traefik routes
# it to the backend on a separate router — so this only needs the SPA
# history fallback plus sensible static-asset caching.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
